<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hfd Pro Site/title>
    <style>
        body {
            background-color: #0b0e14;
            color: #c5cdd8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding-top: 15vh;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            color: #4edbb3;
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.1rem;
            color: #8b98a7;
        }
        .project-badge {
            display: inline-block;
            background: #161b22;
            border: 1px solid #30363d;
            padding: 10px 20px;
            border-radius: 6px;
            margin-top: 30px;
            color: #58a6ff;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }
        .project-badge:hover {
            background: #21262d;
            border-color: #8b98a7;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ Hfd Pro Site 🚀</h1>
        <p>Benim siteme hoş geldiniz!</p>
        <a href="https://github.com/PyNetCoder/SuperNVim" class="project-badge">🎯 SuperNVim Çekirdeğini Keşfedin</a>
    </div>
</body>
</html>
